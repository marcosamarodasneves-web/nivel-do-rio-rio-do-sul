plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.riodosul.niveldorio'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.riodosul.niveldorio'
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName '1.3.0'
        buildConfigField 'String', 'HYDROLOGY_API_BASE', '"https://riomonitor-ukmfechm.manus.space"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
